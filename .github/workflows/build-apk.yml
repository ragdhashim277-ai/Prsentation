name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app zip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using: $ZIP"
          unzip -q -o "$ZIP" -d unpacked
          ls unpacked/albayan_lesson_prep

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android platform files
        working-directory: unpacked/albayan_lesson_prep
        run: flutter create . --platforms=android --project-name albayan_lesson_prep

      - name: Add INTERNET permission for release
        working-directory: unpacked/albayan_lesson_prep
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        working-directory: unpacked/albayan_lesson_prep
        run: flutter pub get

      - name: Build release APK
        working-directory: unpacked/albayan_lesson_prep
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: albayan-apk
          path: unpacked/albayan_lesson_prep/build/app/outputs/flutter-apk/app-release.apk
          
